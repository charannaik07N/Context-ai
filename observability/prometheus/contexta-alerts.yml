groups:
  - name: contexta-api-alerts
    rules:
      - alert: ContextaHigh5xxErrorRate
        expr: |
          (
            sum(rate(contexta_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(contexta_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 10m
        labels:
          severity: critical
          service: contexta-api
        annotations:
          summary: "Contexta API high 5xx error rate"
          description: "5xx ratio exceeded 5% for 10 minutes."

      - alert: ContextaHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(contexta_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: contexta-api
        annotations:
          summary: "Contexta API high p95 latency"
          description: "p95 request latency exceeded 2 seconds for 10 minutes."

      - alert: ContextaSustained429Rate
        expr: |
          (
            sum(rate(contexta_http_requests_total{status="429"}[5m]))
            /
            clamp_min(sum(rate(contexta_http_requests_total[5m])), 0.001)
          ) > 0.20
        for: 10m
        labels:
          severity: warning
          service: contexta-api
        annotations:
          summary: "Contexta API sustained rate-limit pressure"
          description: "HTTP 429 ratio exceeded 20% for 10 minutes."

      - alert: ContextaNoTraffic
        expr: sum(rate(contexta_http_requests_total[10m])) < 0.01
        for: 30m
        labels:
          severity: info
          service: contexta-api
        annotations:
          summary: "Contexta API no traffic detected"
          description: "No meaningful request traffic observed for 30 minutes."
